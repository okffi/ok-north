<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Knowledge Foundation</title>
<style>
:root{--black:#1b1b1b;--yellow:#ffd33d;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--black);line-height:1.6}
header{padding:1rem 2rem;background:var(--white);font-weight:700;font-size:1.25rem;border-bottom:1px solid #eee}
.banner{min-height:70vh;display:flex;align-items:center;padding:4rem 2rem;color:var(--white);background:var(--black) url(banner.svg) center/cover no-repeat}
.banner div{max-width:40rem}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;margin:0 0 1rem}
p{font-size:1.2rem;margin:0 0 2rem}
.btn{display:inline-block;background:var(--yellow);color:var(--black);padding:.9rem 2rem;font-weight:700;text-decoration:none;border-radius:4px}
.btn:hover,.btn:focus{background:var(--white)}
footer{padding:2rem;text-align:center;font-size:.9rem;background:var(--black);color:#bbb}
</style>
</head>
<body>
<header>Open Knowledge Foundation</header>
<section class="banner">
<div>
<h1>Open knowledge for everyone</h1>
<p>Our website is being repaired. Meanwhile, join us and help build a fair, sustainable and open future.</p>
<a class="btn" href="#register">Register</a>
</div>
</section>
<footer id="register">&copy; Open Knowledge Foundation</footer>
</body>
</html>
